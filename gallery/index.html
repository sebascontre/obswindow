    <title>GALERIA FANARTS</title>
    <style type="text/css">
      :root {
        --hsl-color: 330;
      }

      body {
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      img {
        height: calc(100vh - 45px);
        width: calc(100vw - 10px);
        object-fit: contain;
      }
      #window {
        background-color: white;
        display: grid;
        place-items: center;
      }
      #window::before {
        content: "fanarts.exe";
      }
      span.username::before {
        content: "— dibujo por ";
      }
      span.username {
        position: absolute;
        z-index: 11;
        top: 0px;
        left: 120px;

        font-family: "Balsamiq Sans", cursive;
        font-weight: bold;
        font-size: 22px;

        line-height: 35px;
        text-indent: 40px;
      }
    </style>

    <div id="window">
      <span class="username">text</span>
      <img
        src="https://i0.wp.com/f2.toyhou.se/file/f2-toyhou-se/images/20430918_lXp9SSByqnV2SOi.png?w=800"
      />
    </div>

        setInterval(() => {
          var random = Math.floor(Math.random() * images.length) + 1;

          var url =
            "https://i0.wp.com/" + images[random].replace("https://", "");
          var name = "";

          if (url.includes("@")) {
            name = url.substring(url.indexOf("@"));
            url = url.substring(0, url.indexOf("@"));
          }

          if (!url.includes("935")) {
            if (url.includes("?")) url += "&w=800";
            else url += "?w=800";
          }

          document.getElementsByTagName("img")[0].src = url;
          document.getElementsByTagName("img")[0].onload = () => {
            document.getElementsByTagName("span")[0].textContent = name;
          };
        }, 5000);
